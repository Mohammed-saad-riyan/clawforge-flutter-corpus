templates:
  - name: SOCIAL_MEDIA
    keywords: ["social", "feed", "post", "stories", "dm", "profile", "instagram", "facebook", "x", "twitter"]
    architecture: clean_architecture
    state_management: riverpod
    screens: ["feed", "profile", "chat", "stories", "notifications"]
    key_features: ["real_time", "media_upload"]

  - name: ECOMMERCE
    keywords: ["shop", "store", "ecommerce", "cart", "checkout", "order", "product", "catalog", "payment"]
    architecture: clean_architecture
    state_management: riverpod
    screens: ["home", "products", "cart", "checkout", "orders"]
    key_features: ["payments", "inventory"]

  - name: FOOD_DELIVERY
    keywords: ["food", "delivery", "restaurant", "order", "swiggy", "zomato", "uber eats"]
    architecture: clean_architecture
    state_management: riverpod
    screens: ["splash", "onboarding", "auth", "home", "restaurant_detail", "cart", "checkout", "order_tracking", "orders", "profile"]
    models: ["User", "Restaurant", "MenuItem", "CartItem", "Order", "Address", "Review", "Category"]
    services: ["AuthService", "RestaurantService", "CartService", "OrderService", "LocationService", "PaymentService", "NotificationService"]
    packages: ["flutter_riverpod", "go_router", "dio", "google_maps_flutter", "geolocator", "flutter_stripe", "cached_network_image", "shimmer"]

  - name: RIDE_SHARING
